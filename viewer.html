<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>عرض الملف — ArtCorners</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0f0f;
        --muted: #999;
        --accent: #bc1d25;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Cairo", sans-serif;
        background: var(--bg);
        color: #fff;
      }
      .topbar {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .title {
        font-weight: 600;
      }
      .btns {
        display: flex;
        gap: 8px;
      }
      a.btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        text-decoration: none;
      }
      a.btn:hover {
        border-color: var(--accent);
        box-shadow: 0 6px 18px rgba(188, 29, 37, 0.18);
      }
      #viewer {
        position: fixed;
        inset: 64px 0 0 0;
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #222;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: var(--muted);
      }
      .spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 6px solid rgba(255, 255, 255, 0.06);
        border-top-color: var(--accent);
        animation: spin 1s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .message {
        padding: 12px;
        color: var(--muted);
        text-align: center;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title">Company Profile</div>
      <div class="btns">
        <a id="downloadBtn" class="btn" href="#" download>تحميل</a>
        <a class="btn" href="index.html">عودة</a>
      </div>
    </div>

    <div id="viewer">
      <div id="loader" class="overlay">
        <div class="spinner"></div>
        <div class="message">جارٍ تحميل الملف — الرجاء الانتظار...</div>
      </div>

      <div
        id="pdfToolbar"
        style="
          position: absolute;
          top: 8px;
          left: 8px;
          z-index: 5;
          display: flex;
          gap: 8px;
        "
      >
        <button id="prevBtn" class="btn">السابق</button>
        <button id="nextBtn" class="btn">التالي</button>
        <span
          id="pageInfo"
          style="align-self: center; color: var(--muted)"
        ></span>
        <button id="zoomOut" class="btn">-</button>
        <button id="zoomIn" class="btn">+</button>
      </div>

      <canvas
        id="pdfCanvas"
        style="width: 100%; height: 100%; display: block; background: #222"
      ></canvas>

      <div id="error" class="overlay hidden">
        <div class="message">
          عذرًا، حدث خطأ أثناء تحميل الملف أو المتصفح يمنع الوصول.<br />
          <a id="downloadFallback" href="#" class="btn">تنزيل الملف</a>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.9.179/pdf.min.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var file = params.get("file");
        var loader = document.getElementById("loader");
        var error = document.getElementById("error");
        var downloadBtn = document.getElementById("downloadBtn");
        var downloadFallback = document.getElementById("downloadFallback");

        if (!file) {
          loader.classList.add("hidden");
          error.classList.remove("hidden");
          return;
        }

        downloadBtn.href = file;
        downloadBtn.setAttribute("target", "_blank");
        downloadFallback.href = file;

        var isMobile =
          /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent || "",
          );
        if (isMobile) {
          // mobile: open in native viewer
          try {
            window.location.href = file;
            return;
          } catch (e) {}
        }

        // PDF.js setup
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.9.179/pdf.worker.min.js";

        var canvas = document.getElementById("pdfCanvas");
        var ctx = canvas.getContext("2d");
        var currentPage = 1;
        var pdfDoc = null;
        var scale = 1.0;

        var prevBtn = document.getElementById("prevBtn");
        var nextBtn = document.getElementById("nextBtn");
        var pageInfo = document.getElementById("pageInfo");
        var zoomIn = document.getElementById("zoomIn");
        var zoomOut = document.getElementById("zoomOut");

        function renderPage(num) {
          loader.classList.remove("hidden");
          pdfDoc
            .getPage(num)
            .then(function (page) {
              var viewport = page.getViewport({ scale: scale });
              // set canvas size in device pixels for crisp rendering
              var ratio = window.devicePixelRatio || 1;
              canvas.width = Math.floor(viewport.width * ratio);
              canvas.height = Math.floor(viewport.height * ratio);
              canvas.style.width = Math.floor(viewport.width) + "px";
              canvas.style.height = Math.floor(viewport.height) + "px";
              var renderContext = {
                canvasContext: ctx,
                viewport: page.getViewport({ scale: scale * ratio }),
              };
              page
                .render(renderContext)
                .promise.then(function () {
                  loader.classList.add("hidden");
                  pageInfo.textContent = num + " / " + pdfDoc.numPages;
                })
                .catch(function (err) {
                  loader.classList.add("hidden");
                  error.classList.remove("hidden");
                });
            })
            .catch(function (err) {
              loader.classList.add("hidden");
              error.classList.remove("hidden");
            });
        }

        function queueRender(num) {
          if (pdfDoc) renderPage(num);
        }

        prevBtn.addEventListener("click", function () {
          if (currentPage <= 1) return;
          currentPage--;
          queueRender(currentPage);
        });
        nextBtn.addEventListener("click", function () {
          if (currentPage >= pdfDoc.numPages) return;
          currentPage++;
          queueRender(currentPage);
        });
        zoomIn.addEventListener("click", function () {
          scale = Math.min(3, scale + 0.25);
          queueRender(currentPage);
        });
        zoomOut.addEventListener("click", function () {
          scale = Math.max(0.5, scale - 0.25);
          queueRender(currentPage);
        });

        // load the pdf
        var loadingTask = pdfjsLib.getDocument(file);
        loadingTask.promise
          .then(function (pdf) {
            pdfDoc = pdf;
            // initially render first page
            renderPage(currentPage);
          })
          .catch(function (err) {
            loader.classList.add("hidden");
            error.classList.remove("hidden");
          });
      })();
    </script>
  </body>
</html>
